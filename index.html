  <!-- NBNZIA-Style Willem Aperture Opening Sequence -->
  <script>
    (function() {
      function startSequence() {
        const loader = document.getElementById('initialPageLoader');
        if (!loader) return;

        const box = document.getElementById('willemLoaderBox');
        const growingImg = document.getElementById('willemGrowingImage');
        const letters = document.querySelectorAll('.willem__letter');
        const cover1 = document.querySelector('.willem__cover-image-extra.is--1');
        const cover2 = document.querySelector('.willem__cover-image-extra.is--2');
        const h1Start = document.querySelector('.willem__h1-start');
        const h1End = document.querySelector('.willem__h1-end');

        if (typeof gsap === 'undefined') {
          loader.classList.add('loaded');
          setTimeout(() => { if (loader.parentNode) loader.parentNode.removeChild(loader); }, 700);
          return;
        }

        // Lock scrolling while loader sequence is running
        document.body.style.overflow = 'hidden';

        const isMobile = window.innerWidth <= 768;
        const targetWidth = isMobile ? Math.min(window.innerWidth * 0.32, 115) : Math.min(window.innerWidth * 0.165, 220);
        const targetMargin = isMobile ? 8 : 18;

        // Set initial letter transform cleanly with GSAP
        gsap.set(letters, { yPercent: 125, opacity: 0 });

        const tl = gsap.timeline({
          defaults: { ease: 'power3.out' }
        });

        // Step 1: First show full AKSHARA name rising through masked baseline
        tl.to(letters, {
          yPercent: 0,
          opacity: 1,
          duration: 0.85,
          stagger: 0.05,
          ease: 'power3.out'
        });

        // Step 2: Now that AKSHARA name is clearly displayed, open image in between H and A
        tl.to(box, {
          width: targetWidth,
          marginLeft: targetMargin,
          marginRight: targetMargin,
          duration: 0.9,
          ease: 'power3.inOut'
        }, '+=0.35');

        // Step 3: Hold Vellore cover, then smoothly cross-fade to Chittoor cover
        tl.to(cover1, {
          opacity: 0,
          duration: 0.45,
          ease: 'power2.inOut'
        }, '+=0.4');

        // Step 4: Hold Chittoor cover, then smoothly cross-fade to Main Hero cover
        tl.to(cover2, {
          opacity: 0,
          duration: 0.45,
          ease: 'power2.inOut'
        }, '+=0.4');

        // Step 5: Climax - Hero image expands to full screen while letters glide outward
        tl.add(() => {
          if (!growingImg || !box) return;
          const rect = box.getBoundingClientRect();
          gsap.set(growingImg, {
            position: 'fixed',
            top: rect.top,
            left: rect.left,
            width: rect.width,
            height: rect.height,
            borderRadius: isMobile ? '8px' : '12px',
            zIndex: 99999999
          });
        }, '+=0.25');

        tl.to(growingImg, {
          top: 0,
          left: 0,
          width: '100vw',
          height: '100dvh',
          borderRadius: '0px',
          duration: 1.05,
          ease: 'power3.inOut'
        }, 'expand');

        tl.to(h1Start, {
          x: '-35vw',
          opacity: 0,
          duration: 0.85,
          ease: 'power3.in'
        }, 'expand');

        tl.to(h1End, {
          x: '35vw',
          opacity: 0,
          duration: 0.85,
          ease: 'power3.in'
        }, 'expand');

        // Step 6: Seamlessly fade out loader overlay to live site
        tl.to(loader, {
          opacity: 0,
          duration: 0.55,
          ease: 'power2.out',
          onComplete: () => {
            loader.classList.add('loaded');
            document.body.style.overflow = '';
            if (loader.parentNode) {
              loader.parentNode.removeChild(loader);
            }
          }
        }, '+=0.1');

        // Safeguard timeout to ensure page is always accessible even on slow networks
        setTimeout(() => {
          if (loader && loader.parentNode) {
            loader.classList.add('loaded');
            document.body.style.overflow = '';
            loader.parentNode.removeChild(loader);
          }
        }, 5000);

        // Fast-Forward on click
        loader.addEventListener('click', () => {
          if (tl.progress() < 0.75) {
            tl.timeScale(2.5);
          }
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startSequence);
      } else {
        startSequence();
      }
    })();
  </script>
