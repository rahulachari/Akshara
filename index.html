<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akshara - DTCP & RERA Approved Residential Plotted Layouts</title>
  <meta name="description" content="Explore premium DTCP, CMDA & RERA approved residential plots in Vellore, Chittoor, Tirupati, and Chennai. 100% clear titles, 40ft asphalt roads, and complete subterranean infrastructure." />
  <meta name="keywords" content="Akshara plotted developments, residential plots Vellore, land for sale Tirupati, approved layouts Chittoor, villa plots Chennai, DTCP layout, RERA plots" />
  
  <!-- Open Graph / Meta -->
  <meta property="og:title" content="Akshara Plotted Developments - Approved Residential Layouts" />
  <meta property="og:description" content="DTCP & CMDA approved plotted layouts with 40ft asphalt roads and complete infrastructure in Vellore, Chittoor, Tirupati & Chennai." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/hero_visual.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/colus" rel="stylesheet">

  <!-- Main Design System Stylesheet -->
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/MaskedHeading.css" />
</head>
<body>

  <!-- Public Site Application Container -->
  <div id="publicApp"></div>

  <!-- Admin Panel Workspace Container -->
  <div id="adminApp" style="display: none;"></div>

  <!-- Global Detail / Form Modal Overlay -->
  <div class="modal-overlay" id="globalModalOverlay" onclick="if(event.target === this) app.closeGlobalModal()">
    <div class="modal-card">
      <button class="modal-close-btn" onclick="app.closeGlobalModal()" title="Close">✕</button>
      <div class="modal-body" id="globalModalBody">
        <!-- Dynamic modal content inserted here -->
      </div>
    </div>
  </div>

  <!-- Toast Notifications Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Application Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="js/store.js"></script>
  <script src="js/components/public.js"></script>
  <script src="js/components/admin.js"></script>
  <script src="js/app.js"></script>

  <!-- Gradual Blur Page Effect -->
  <div style="position: fixed; bottom: 0; left: 0; width: 100%; height: 2.5rem; z-index: 998; pointer-events: none; overflow: hidden; isolation: isolate;">
    <div style="position: relative; width: 100%; height: 100%;">
      <div style="position: absolute; inset: 0; backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 40%, transparent 60%); -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 40%, transparent 60%);"></div>
      <div style="position: absolute; inset: 0; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); mask-image: linear-gradient(to bottom, transparent 20%, black 40%, black 60%, transparent 80%); -webkit-mask-image: linear-gradient(to bottom, transparent 20%, black 40%, black 60%, transparent 80%);"></div>
      <div style="position: absolute; inset: 0; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); mask-image: linear-gradient(to bottom, transparent 40%, black 60%, black 80%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, transparent 40%, black 60%, black 80%, transparent 100%);"></div>
      <div style="position: absolute; inset: 0; backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); mask-image: linear-gradient(to bottom, transparent 60%, black 80%, black 100%); -webkit-mask-image: linear-gradient(to bottom, transparent 60%, black 80%, black 100%);"></div>
      <div style="position: absolute; inset: 0; backdrop-filter: blur(48px); -webkit-backdrop-filter: blur(48px); mask-image: linear-gradient(to bottom, transparent 80%, black 100%); -webkit-mask-image: linear-gradient(to bottom, transparent 80%, black 100%);"></div>
    </div>
  </div>
</body>
</html>
